name: Foundry

on:
  push:
    branches:
      - main
  pull_request:

# Allows to skip tests if compilation fails.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-via-ir:
    name: Compilation (via IR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - uses: ./.github/actions/install

      - name: Build contracts via IR & check sizes
        # skip import files, because we don't care if contracts are too big
        run: forge build --sizes --skip Import

      - name: Save forge compilation cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            cache
            out
          key: forge-${{ github.ref_name }}-${{ github.run_id }}

  test:
    needs: build-via-ir

    name: Tests on chainid = ${{ matrix.chain }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        chain: [1, 8453]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - uses: ./.github/actions/install

      - name: Run tests on chain ${{ matrix.chain }}
        run: |
          encode() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'NR > 1 { printf "%%0A" } { printf "%s", $0 }'; }

          printf '::notice title=forge-version::%s\n' "$(forge --version | encode)"

          set -o pipefail
          status=0
          forge test --chain ${{ matrix.chain }} 2>&1 | tee "$RUNNER_TEMP/forge-test.log" || status=$?

          if [ "$status" -ne 0 ]; then
            log="$RUNNER_TEMP/forge-test.clean.log"
            sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' -e 's/\r$//' "$RUNNER_TEMP/forge-test.log" > "$log"

            grep '^\[FAIL' "$log" | awk '!seen[$0]++' | head -n 28 | while IFS= read -r line; do
              printf '::error title=forge-test::%s\n' "$(printf '%s\n' "$line" | encode)"
            done || true

            summary=$(sed -n '/^Failing tests:/,$p' "$log" | encode)
            if [ -n "$summary" ]; then
              printf '::error title=forge-test::%s\n' "$summary"
            fi
          fi

          exit $status
        env:
          ALCHEMY_KEY: ${{ secrets.PROTOCOL_ALCHEMY_KEY }}
          NO_COLOR: 1
